<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enxoval · Nômade Stays</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--marinho:#3C485C;--medio:#496B88;--floresta:#2D4C3B;--bege:#D7C8B1;--gelo:#CCD4D9;--fundo:#F6F5F2;--alerta:#9A3B2E}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--marinho);padding-bottom:32px}
header{background:var(--marinho);color:#fff;padding:16px;font-weight:600;font-size:18px}
.quem{display:flex;align-items:center;gap:10px;margin:12px 16px 0;font-size:13px;color:var(--medio)}
.quem input{flex:1;padding:10px;border:1px solid var(--gelo);border-radius:10px;font-size:16px;color:var(--marinho);background:#fff}
nav{display:flex;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--fundo);z-index:2;flex-wrap:wrap}
nav button{flex:1 1 30%;padding:12px 6px;border:1px solid var(--gelo);background:#fff;border-radius:12px;font-size:14px;color:var(--marinho);cursor:pointer}
nav button.on{background:var(--floresta);color:#fff;border-color:var(--floresta)}
.banner{margin:0 16px 8px;padding:8px 12px;border-radius:10px;background:var(--bege);font-size:13px;display:none}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--medio);margin:18px 16px 6px}
.item{background:#fff;margin:0 16px 8px;border-radius:14px;padding:12px 14px;border:1px solid var(--gelo)}
.nome{font-size:15px;font-weight:500}
.linha{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px;gap:10px;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;font-size:11px;color:var(--medio)}
.campo input{width:96px;padding:8px;border:1px solid var(--gelo);border-radius:8px;font-size:16px;margin-top:4px;color:var(--marinho)}
.salvar{margin-top:6px;padding:8px 14px;border-radius:10px;border:none;background:var(--floresta);color:#fff;font-size:14px;cursor:pointer;display:none}
.registro{font-size:11px;color:var(--medio);margin-top:6px}
.bloco{display:flex;flex-direction:column;font-size:11px;color:var(--medio);align-items:center}
.step{display:flex;align-items:center;gap:6px;margin-top:4px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--gelo);background:var(--fundo);font-size:22px;color:var(--marinho);cursor:pointer}
.step button.mais{background:var(--floresta);color:#fff;border-color:var(--floresta)}
.step span{min-width:32px;text-align:center;font-size:18px;font-weight:600;color:var(--marinho)}
.estoque{font-size:22px;font-weight:700;text-align:center;min-width:72px;color:var(--floresta)}
.estoque small{display:block;font-size:11px;font-weight:400;color:var(--medio)}
.neg{color:var(--alerta)}
.dia{display:flex;align-items:center;gap:10px;margin:12px 16px 0;font-size:14px;color:var(--medio)}
.dia input{padding:8px;border:1px solid var(--gelo);border-radius:10px;font-size:16px;color:var(--marinho);background:#fff}
.tabela{margin:0 16px 8px;background:#fff;border:1px solid var(--gelo);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--gelo)}
th{font-size:11px;text-transform:uppercase;color:var(--medio);font-weight:600}
td:first-child,th:first-child{text-align:left}
tr.grupo td{background:var(--fundo);font-size:11px;text-transform:uppercase;color:var(--medio);font-weight:600;text-align:left}
.log{margin:0 16px 6px;background:#fff;border:1px solid var(--gelo);border-radius:12px;padding:10px 12px;font-size:14px}
.log .quando{font-size:11px;color:var(--medio)}
.rodape{margin:24px 16px 0}
.btn-salvar-tudo{width:100%;padding:16px;border:none;border-radius:14px;background:var(--floresta);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.confirma{margin-top:10px;padding:10px 12px;border-radius:10px;background:#E4EDE7;color:var(--floresta);font-size:14px;display:none}
</style>
</head>
<body>
<header>Enxoval · Nômade Stays</header>
<div class="quem">
  <span>Seu nome:</span>
  <input id="nome" type="text" placeholder="Digite seu nome" autocomplete="name">
</div>
<nav>
  <button id="t-resumo" class="on">Resumo</button>
  <button id="t-pinheiros">Pinheiros</button>
  <button id="t-vila-mariana">Vila Mariana</button>
  <button id="t-historico">Histórico</button>
</nav>
<div id="banner" class="banner"></div>
<main id="lista"></main>
<script>
// Mesmo projeto Firebase da Lavanderia Nômade (configuração pública do app web).
firebase.initializeApp({
  apiKey:"AIzaSyDzHIzTP_WKb9JSntqybQnRRB_SVxoTSG8",
  authDomain:"lavanderianomade.firebaseapp.com",
  databaseURL:"https://lavanderianomade-default-rtdb.firebaseio.com",
  projectId:"lavanderianomade",
  storageBucket:"lavanderianomade.firebasestorage.app",
  messagingSenderId:"",
  appId:""
});
const db = firebase.database();
const RAIZ = "enxoval";   // dados ficam em enxoval/estoque e enxoval/eventos

const GRUPOS = [
  {nome:"Lençóis", itens:[
    ["lencol-cobrir-king","Lençol cobrir — king"],
    ["lencol-elastico-king","Lençol elástico — king"],
    ["lencol-cobrir-queen","Lençol cobrir — queen"],
    ["lencol-elastico-queen","Lençol elástico — queen"],
    ["lencol-cobrir-casal","Lençol cobrir — casal"],
    ["lencol-elastico-casal","Lençol elástico — casal"],
    ["lencol-cobrir-solteiro","Lençol cobrir — solteiro"],
    ["lencol-elastico-solteiro","Lençol elástico — solteiro"]
  ]},
  {nome:"Edredons e cobertores", itens:[
    ["capa-edredom-king","Capa edredom/cobre-leito — king"],
    ["capa-edredom-queen","Capa edredom/cobre-leito — queen"],
    ["capa-edredom-casal","Capa edredom/cobre-leito — casal"]
  ]},
  {nome:"Fronhas/banho", itens:[
    ["fronha","Fronha"],
    ["toalha-banho","Toalha de banho"],
    ["toalha-rosto","Toalha de rosto"],
    ["toalha-piso","Toalha de piso"],
    ["toalha-make-up","Toalha make up"],
    ["panos-prato","Panos de prato"]
  ]}
];
const NOMES_ITENS = {};
GRUPOS.forEach(g => g.itens.forEach(([id, nome]) => NOMES_ITENS[id] = nome));
const UNIDADES = [["pinheiros","Pinheiros"],["vila-mariana","Vila Mariana"]];
const NOMES_UNIDADES = {"pinheiros":"Pinheiros","vila-mariana":"Vila Mariana"};

let tela = "resumo";     // "resumo" | "pinheiros" | "vila-mariana" | "historico"
let estado = {};         // "pinheiros-fronha" -> {inicial, inicialPor, inicialEm, usados}
let eventos = [];        // {tipo: "inicial"|"uso", unidade, item, ...}
let rascunho = {};       // valores digitados e ainda não salvos
let confirmacao = "";    // mensagem de "salvo" no fim da tela
let resumoDia = diaLocal(new Date());

const campoNome = document.getElementById("nome");
try { campoNome.value = localStorage.getItem("enxoval-nome") || ""; } catch (e) {}
campoNome.onchange = () => { try { localStorage.setItem("enxoval-nome", campoNome.value.trim()); } catch (e) {} };

function nomeAtual(){ return campoNome.value.trim(); }
function chave(u, i){ return u + "-" + i; }
function diaLocal(d){
  const p = x => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function formataData(iso){
  try { return new Date(iso).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"}); }
  catch (e) { return iso; }
}
function horaAgora(){
  return new Date().toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
}
function aviso(t){
  const b = document.getElementById("banner");
  b.textContent = t || "";
  b.style.display = t ? "block" : "none";
}
function grava(caminho, dados){
  db.ref(RAIZ + "/" + caminho).set(dados).catch(() => aviso("Não consegui salvar. Confira a conexão e tente de novo."));
}
function registra(ev){
  db.ref(RAIZ + "/eventos").push(ev).catch(() => aviso("Não consegui registrar a alteração. Confira a conexão."));
}

// Grava um estoque inicial digitado (sem redesenhar a tela).
function gravaInicial(u, id, texto, nomeQuem){
  const k = chave(u, id);
  const s = estado[k] || {inicial: null, usados: 0};
  const novoInicial = texto === "" ? null : Math.max(0, parseInt(texto, 10));
  const agora = new Date().toISOString();
  const nv = {inicial: novoInicial, usados: s.usados, inicialPor: nomeQuem, inicialEm: agora};
  estado[k] = nv;
  delete rascunho[k];
  grava("estoque/" + k, nv);
  registra({tipo: "inicial", unidade: u, item: id, de: s.inicial == null ? null : s.inicial, para: novoInicial, por: nomeQuem, em: agora, dia: diaLocal(new Date())});
}

function salvaInicial(u, id){
  const nomeQuem = nomeAtual();
  if (!nomeQuem) { aviso("Digite seu nome antes de salvar."); campoNome.focus(); return; }
  const k = chave(u, id);
  if (rascunho[k] === undefined) return;
  aviso("");
  gravaInicial(u, id, rascunho[k], nomeQuem);
  confirmacao = "Salvo às " + horaAgora() + ".";
  render();
}

// Salva de uma vez tudo o que foi digitado nesta unidade.
function salvaTudo(u){
  const nomeQuem = nomeAtual();
  const pendentes = Object.keys(rascunho).filter(k => k.startsWith(u + "-"));
  if (!pendentes.length) {
    confirmacao = "Tudo já está salvo (último registro às " + horaAgora() + ").";
    render();
    return;
  }
  if (!nomeQuem) { aviso("Digite seu nome antes de salvar."); campoNome.focus(); return; }
  aviso("");
  for (const k of pendentes){
    gravaInicial(u, k.slice(u.length + 1), rascunho[k], nomeQuem);
  }
  confirmacao = "Salvo às " + horaAgora() + ": " + pendentes.length + (pendentes.length === 1 ? " item." : " itens.");
  render();
}

function mudaUsados(u, id, delta){
  const k = chave(u, id);
  const s = estado[k] || {inicial: null, usados: 0};
  const novo = Math.max(0, s.usados + delta);
  const real = novo - s.usados;
  if (real === 0) return;
  const nv = {...s, usados: novo};
  estado[k] = nv;
  confirmacao = "";
  render();
  grava("estoque/" + k, nv);
  registra({tipo: "uso", unidade: u, item: id, delta: real, por: nomeAtual() || "sem nome", em: new Date().toISOString(), dia: diaLocal(new Date())});
}

function somaUsos(u, item, dia, ate){
  return eventos
    .filter(e => (e.tipo || "uso") === "uso" && e.unidade === u && e.item === item && (ate ? e.dia <= dia : e.dia === dia))
    .reduce((a, e) => a + e.delta, 0);
}

function render(){
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("on"));
  document.getElementById("t-" + tela).classList.add("on");
  if (tela === "resumo") renderResumo();
  else if (tela === "historico") renderHistorico();
  else renderUnidade(tela);
}

function renderRodape(u){
  const main = document.getElementById("lista");
  const rod = document.createElement("div");
  rod.className = "rodape";
  const b = document.createElement("button");
  b.className = "btn-salvar-tudo";
  const pendentes = Object.keys(rascunho).filter(k => k.startsWith(u + "-")).length;
  b.textContent = pendentes ? "Salvar (" + pendentes + (pendentes === 1 ? " item pendente)" : " itens pendentes)") : "Salvar";
  b.onclick = () => salvaTudo(u);
  rod.appendChild(b);
  const c = document.createElement("div");
  c.className = "confirma";
  if (confirmacao) {
    c.textContent = confirmacao;
    c.style.display = "block";
  }
  rod.appendChild(c);
  main.appendChild(rod);
}

function renderUnidade(u){
  const main = document.getElementById("lista");
  main.textContent = "";
  for (const g of GRUPOS){
    const h = document.createElement("h2");
    h.textContent = g.nome;
    main.appendChild(h);
    for (const [id, nome] of g.itens){
      const k = chave(u, id);
      const s = estado[k] || {inicial: null, usados: 0};
      const emEstoque = s.inicial == null ? null : s.inicial - s.usados;
      const rasc = rascunho[k];

      const card = document.createElement("div");
      card.className = "item";
      const n = document.createElement("div");
      n.className = "nome";
      n.textContent = nome;
      card.appendChild(n);

      const linha = document.createElement("div");
      linha.className = "linha";

      const campo = document.createElement("label");
      campo.className = "campo";
      campo.textContent = "Estoque inicial";
      const inp = document.createElement("input");
      inp.type = "number";
      inp.min = "0";
      inp.inputMode = "numeric";
      inp.value = rasc !== undefined ? rasc : (s.inicial == null ? "" : s.inicial);
      const btn = document.createElement("button");
      btn.className = "salvar";
      btn.textContent = "Salvar";
      if (rasc !== undefined) btn.style.display = "inline-block";
      inp.oninput = () => {
        rascunho[k] = inp.value;
        confirmacao = "";
        btn.style.display = "inline-block";
      };
      btn.onclick = () => salvaInicial(u, id);
      campo.appendChild(inp);
      campo.appendChild(btn);

      const bloco = document.createElement("div");
      bloco.className = "bloco";
      const rot = document.createElement("span");
      rot.textContent = "Itens utilizados";
      const step = document.createElement("div");
      step.className = "step";
      const menos = document.createElement("button");
      menos.textContent = "−";
      menos.onclick = () => mudaUsados(u, id, -1);
      const cont = document.createElement("span");
      cont.textContent = s.usados;
      const mais = document.createElement("button");
      mais.textContent = "+";
      mais.className = "mais";
      mais.onclick = () => mudaUsados(u, id, 1);
      step.append(menos, cont, mais);
      bloco.append(rot, step);

      const est = document.createElement("div");
      est.className = "estoque" + (emEstoque != null && emEstoque < 0 ? " neg" : "");
      est.textContent = emEstoque == null ? "—" : emEstoque;
      const sm = document.createElement("small");
      sm.textContent = "Itens em estoque";
      est.appendChild(sm);

      linha.append(campo, bloco, est);
      card.appendChild(linha);

      if (s.inicialEm) {
        const reg = document.createElement("div");
        reg.className = "registro";
        reg.textContent = "Preenchido por " + s.inicialPor + " em " + formataData(s.inicialEm);
        card.appendChild(reg);
      }
      main.appendChild(card);
    }
  }
  renderRodape(u);
}

function renderResumo(){
  const main = document.getElementById("lista");
  main.textContent = "";

  const linhaDia = document.createElement("div");
  linhaDia.className = "dia";
  const rot = document.createElement("span");
  rot.textContent = "Dia:";
  const inpDia = document.createElement("input");
  inpDia.type = "date";
  inpDia.value = resumoDia;
  inpDia.onchange = () => { resumoDia = inpDia.value || diaLocal(new Date()); renderResumo(); };
  linhaDia.append(rot, inpDia);
  main.appendChild(linhaDia);

  for (const [u, rotuloUnidade] of UNIDADES){
    const h = document.createElement("h2");
    h.textContent = rotuloUnidade;
    main.appendChild(h);

    const wrap = document.createElement("div");
    wrap.className = "tabela";
    const tab = document.createElement("table");
    const cab = document.createElement("tr");
    ["Item", "Inicial", "Utilizados no dia", "Em estoque no fim do dia"].forEach(t => {
      const th = document.createElement("th");
      th.textContent = t;
      cab.appendChild(th);
    });
    const thead = document.createElement("thead");
    thead.appendChild(cab);
    tab.appendChild(thead);

    const corpo = document.createElement("tbody");
    for (const g of GRUPOS){
      const gr = document.createElement("tr");
      gr.className = "grupo";
      const gtd = document.createElement("td");
      gtd.colSpan = 4;
      gtd.textContent = g.nome;
      gr.appendChild(gtd);
      corpo.appendChild(gr);
      for (const [id, nome] of g.itens){
        const s = estado[chave(u, id)] || {inicial: null, usados: 0};
        const usadosDia = somaUsos(u, id, resumoDia, false);
        const usadosAte = somaUsos(u, id, resumoDia, true);
        const emFim = s.inicial == null ? null : s.inicial - usadosAte;
        const tr = document.createElement("tr");
        const celulas = [nome, s.inicial == null ? "—" : s.inicial, usadosDia, emFim == null ? "—" : emFim];
        celulas.forEach((c, i) => {
          const td = document.createElement("td");
          td.textContent = c;
          if (i === 3 && emFim != null && emFim < 0) td.className = "neg";
          tr.appendChild(td);
        });
        corpo.appendChild(tr);
      }
    }
    tab.appendChild(corpo);
    wrap.appendChild(tab);
    main.appendChild(wrap);
  }
}

function renderHistorico(){
  const main = document.getElementById("lista");
  main.textContent = "";
  const h = document.createElement("h2");
  h.textContent = "Alterações (mais recentes primeiro)";
  main.appendChild(h);

  const lista = [...eventos].sort((a, b) => (b.em || "").localeCompare(a.em || ""));
  if (!lista.length) {
    const vazio = document.createElement("div");
    vazio.className = "log";
    vazio.textContent = "Nenhuma alteração registrada ainda.";
    main.appendChild(vazio);
    return;
  }
  for (const e of lista){
    const box = document.createElement("div");
    box.className = "log";
    const quando = document.createElement("div");
    quando.className = "quando";
    quando.textContent = formataData(e.em) + " · " + (e.por || "sem nome") + " · " + (NOMES_UNIDADES[e.unidade] || e.unidade);
    const texto = document.createElement("div");
    const item = NOMES_ITENS[e.item] || e.item;
    if ((e.tipo || "uso") === "inicial") {
      texto.textContent = item + ": estoque inicial de " + (e.de == null ? "—" : e.de) + " para " + (e.para == null ? "—" : e.para);
    } else {
      const sinal = e.delta > 0 ? "+" + e.delta : String(e.delta);
      texto.textContent = item + ": itens utilizados " + sinal;
    }
    box.append(quando, texto);
    main.appendChild(box);
  }
}

function trocaTela(t){
  tela = t;
  confirmacao = "";
  aviso("");
  render();
}
document.getElementById("t-resumo").onclick = () => trocaTela("resumo");
document.getElementById("t-pinheiros").onclick = () => trocaTela("pinheiros");
document.getElementById("t-vila-mariana").onclick = () => trocaTela("vila-mariana");
document.getElementById("t-historico").onclick = () => trocaTela("historico");

// Escuta as alterações em tempo real (todas as pessoas veem a mesma coisa).
db.ref(RAIZ + "/estoque").on("value", snap => {
  estado = snap.val() || {};
  render();
}, () => aviso("Não consegui ler os dados. Confira a conexão."));
db.ref(RAIZ + "/eventos").on("value", snap => {
  eventos = Object.values(snap.val() || {});
  render();
}, () => aviso("Não consegui ler o histórico. Confira a conexão."));

render();
</script>
</body>
</html>
